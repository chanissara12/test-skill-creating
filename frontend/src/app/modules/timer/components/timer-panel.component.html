<section class="border-b border-hairline bg-white p-4">
    <div class="flex flex-wrap items-center gap-3">
        <input
            #titleBox
            type="text"
            aria-label="What are you working on?"
            placeholder="ทำงานอะไรอยู่?"
            [attr.maxlength]="maxTitleLength"
            [value]="inputValue()"
            [disabled]="running() !== undefined"
            (input)="draftTitle.set(titleBox.value)"
            (keydown.enter)="toggle()"
            class="min-w-64 flex-1 rounded-sm border border-hairline px-3 py-2.5 text-base text-ink focus:outline-none focus:ring-2 focus:ring-primary disabled:cursor-not-allowed disabled:bg-lavender disabled:text-ink-mute"
        />
        <span class="text-2xl font-bold tracking-tight text-ink tabular-nums" aria-live="off">{{ elapsed() }}</span>
        <button
            type="button"
            (click)="toggle()"
            [disabled]="buttonDisabled()"
            class="shrink-0 cursor-pointer rounded-pill bg-primary px-7 py-3.5 text-base font-bold whitespace-nowrap text-on-primary hover:bg-primary-press focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:bg-primary-tint disabled:cursor-not-allowed disabled:opacity-40"
        >
            {{ running() ? '■ หยุด' : '▶ เริ่ม' }}
        </button>
    </div>
    @if (errorMessage(); as message) {
        <p role="alert" class="mt-3 text-sm text-err">{{ message }}</p>
    }
</section>
