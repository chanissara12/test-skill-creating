<section class="border-b border-hairline bg-white p-4">
    @if (loadingRunning()) {
        <div role="status" aria-label="กำลังโหลดตัวจับเวลา" class="flex animate-pulse items-center gap-3 motion-reduce:animate-none">
            <div class="h-11 min-w-64 flex-1 rounded-sm bg-hairline"></div>
            <div class="h-8 w-24 rounded-sm bg-hairline"></div>
            <div class="h-12 w-28 rounded-pill bg-hairline"></div>
        </div>
    } @else {
        <div class="flex flex-wrap items-center gap-3">
            <input
                #titleBox
                type="text"
                aria-label="ทำงานอะไรอยู่?"
                placeholder="ทำงานอะไรอยู่?"
                [attr.maxlength]="maxTitleLength"
                [value]="inputValue()"
                [disabled]="running() !== undefined"
                (input)="draftTitle.set(titleBox.value)"
                (keydown.enter)="toggle()"
                class="min-w-64 flex-1 rounded-sm border border-hairline px-3 py-2.5 text-base text-ink placeholder:text-ink-mute enabled:hover:border-ink-mute focus:outline-none focus:ring-2 focus:ring-primary disabled:cursor-not-allowed disabled:bg-lavender disabled:text-ink-mute"
            />
            <span class="text-2xl font-bold tracking-tight text-ink tabular-nums" aria-live="off">{{ elapsed() }}</span>
            <button
                type="button"
                (click)="toggle()"
                [disabled]="buttonDisabled()"
                class="inline-flex shrink-0 cursor-pointer items-center gap-2 rounded-pill bg-primary px-7 py-3.5 text-base font-bold whitespace-nowrap text-on-primary hover:bg-primary-press focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:bg-primary-tint disabled:cursor-not-allowed disabled:opacity-40"
            >
                @if (busy()) {
                    <span aria-hidden="true" class="inline-block size-4 animate-spin rounded-full motion-reduce:animate-none border-2 border-current border-t-transparent"></span>
                }
                {{ running() ? '■ หยุด' : '▶ เริ่ม' }}
            </button>
        </div>
    }
    @if (errorMessage(); as message) {
        <p role="alert" class="mt-3 text-sm text-err">{{ message }}</p>
    }
</section>
